name: CD - Déploiement

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement de déploiement'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository | lower }}

jobs:
  # Build et push de l'image Docker
  build-and-push:
    name: Build et Push Image Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tags: |
              type=ref,event=branch
              type=ref,event=pr
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=sha,prefix={{branch}}-
              type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Scan de sécurité de l'image Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload des résultats du scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Déploiement en staging
  deploy-staging:
    name: Déployer en Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.devfest-studio.example.com

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Configuration kubectl
        uses: azure/setup-kubectl@v4
        if: false  # Activez si vous utilisez Kubernetes

      - name: Déploiement sur le serveur staging
        run: |
          echo "🚀 Déploiement en staging..."
          # Ajoutez ici vos commandes de déploiement
          # Exemple avec SSH:
          # ssh user@staging-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          # ssh user@staging-server "docker-compose up -d"
          echo "✅ Déploiement staging terminé"

      - name: Test de santé staging
        run: |
          echo "🏥 Vérification de la santé de l'application..."
          # curl -f https://staging.devfest-studio.example.com/api/v1/health

  # Déploiement en production
  deploy-production:
    name: Déployer en Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.devfest-studio.example.com

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Confirmation du déploiement
        run: |
          echo "⚠️ Déploiement en PRODUCTION"
          echo "Version: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"

      - name: Déploiement sur le serveur production
        run: |
          echo "🚀 Déploiement en production..."
          # Ajoutez ici vos commandes de déploiement production
          # Exemple avec SSH:
          # ssh user@prod-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # ssh user@prod-server "docker-compose up -d --no-deps api"
          echo "✅ Déploiement production terminé"

      - name: Test de santé production
        run: |
          echo "🏥 Vérification de la santé de l'application..."
          # curl -f https://api.devfest-studio.example.com/api/v1/health

      - name: Création d'une release GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/**/*

  # Rollback en cas d'échec
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()

    steps:
      - name: Rollback automatique
        run: |
          echo "⚠️ Échec détecté - Rollback en cours..."
          # Ajoutez ici la logique de rollback
          # Exemple: déployer la version précédente
          echo "✅ Rollback terminé"
